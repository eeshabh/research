<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284" role="img" aria-label="Left: 2,509 women in the public dataset, 1,813 patients modeled, 454 held out for testing, 121 with relapse or death within five years. Right: AUC on a scale from 0.5, a coin flip, to 1.0, perfect. Clinical data only scored 0.692. Adding genetic data scored 0.725." xmlns:c2pa="http://c2pa.org/manifest"><title>From records to result</title><rect x="0.5" y="0.5" width="759" height="283" rx="6" fill="#ffffff" stroke="#cdd3d8"/><text x="28.0" y="36.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" letter-spacing="0.8" style="fill:#586273">FIG. 1</text><text x="732.0" y="36.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" letter-spacing="0.8" style="fill:#586273">FROM RECORDS TO RESULT</text><text x="28.0" y="88.0" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="400" letter-spacing="0.0" style="fill:#0e1726">2,509</text><text x="132.0" y="88.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" letter-spacing="0.8" style="fill:#586273">PATIENTS ANALYZED</text><text x="28.0" y="122.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" letter-spacing="0.6" style="fill:#586273">WOMEN IN THE PUBLIC DATASET</text><text x="360.0" y="122.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" letter-spacing="0.0" style="fill:#0e1726">2,509</text><rect x="28" y="129" width="332.0" height="9" rx="2" fill="#2540d9"/><text x="28.0" y="160.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" letter-spacing="0.6" style="fill:#586273">PATIENTS I MODELED</text><text x="360.0" y="160.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" letter-spacing="0.0" style="fill:#0e1726">1,813</text><rect x="28" y="167" width="239.9" height="9" rx="2" fill="#2540d9"/><text x="28.0" y="198.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" letter-spacing="0.6" style="fill:#586273">HELD OUT FOR TESTING</text><text x="360.0" y="198.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" letter-spacing="0.0" style="fill:#0e1726">454</text><rect x="28" y="205" width="60.1" height="9" rx="2" fill="#2540d9"/><text x="28.0" y="236.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" letter-spacing="0.6" style="fill:#586273">RELAPSE OR DEATH WITHIN 5 YEARS</text><text x="360.0" y="236.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" letter-spacing="0.0" style="fill:#0e1726">121</text><rect x="28" y="243" width="16.0" height="9" rx="2" fill="#2540d9"/><line x1="396" y1="62" x2="396" y2="256" stroke="#cdd3d8"/><text x="432.0" y="88.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" letter-spacing="0.8" style="fill:#586273">HOW WELL EACH MODEL RANKS RISK (AUC)</text><line x1="438.0" y1="168.0" x2="726.0" y2="168.0" stroke="#0e1726" stroke-width="1.2"/><line x1="438.0" y1="163.0" x2="438.0" y2="173.0" stroke="#0e1726" stroke-width="1"/><line x1="495.6" y1="163.0" x2="495.6" y2="173.0" stroke="#0e1726" stroke-width="1"/><line x1="553.2" y1="163.0" x2="553.2" y2="173.0" stroke="#0e1726" stroke-width="1"/><line x1="610.8" y1="163.0" x2="610.8" y2="173.0" stroke="#0e1726" stroke-width="1"/><line x1="668.4" y1="163.0" x2="668.4" y2="173.0" stroke="#0e1726" stroke-width="1"/><line x1="726.0" y1="163.0" x2="726.0" y2="173.0" stroke="#0e1726" stroke-width="1"/><line x1="548.6" y1="146.0" x2="548.6" y2="160.0" stroke="#0e1726" stroke-width="1"/><text x="554.6" y="138.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" letter-spacing="0.0" style="fill:#0e1726">clinical only 0.692</text><circle cx="548.6" cy="168.0" r="6" fill="#ffffff" stroke="#0e1726" stroke-width="1.8"/><line x1="567.6" y1="176.0" x2="567.6" y2="190.0" stroke="#0e1726" stroke-width="1"/><text x="561.6" y="206.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" letter-spacing="0.0" style="fill:#0e1726">0.725 with genetic data</text><circle cx="567.6" cy="168.0" r="6.5" fill="#2540d9"/><text x="438.0" y="240.0" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" letter-spacing="0.0" style="fill:#586273">0.5 coin flip</text><text x="726.0" y="240.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" letter-spacing="0.0" style="fill:#586273">1.0 perfect</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
